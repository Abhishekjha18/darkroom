# Version pinned, host triple NOT pinned — see BUILD.md §2.
#
# The exact-host-triple form (`1.97.1-x86_64-pc-windows-gnu`) errors outright
# on rustup for macOS/Linux ("target tuple in channel name"), which breaks
# the "builds in one command" claim for any judge not on that machine. The
# reproducible-build evidence doesn't depend on this file at all —
# `build-repro.ps1` hardcodes its own toolchain string and passes
# `+$toolchain` and `--target` explicitly on every invocation, so relaxing
# this file to a portable version pin costs nothing there.
[toolchain]
channel = "1.97.1"
