[package]
name = "darkroom"
version = "0.1.0"
edition = "2024"
description = "Point it at a folder of photos. Browse them from your phone. It finds the duplicates."
license = "MIT"

# This is the headline claim. Nothing goes here, ever.
[dependencies]

# `cdylib` is what makes `cargo build --target wasm32-unknown-unknown` emit a
# loadable `.wasm` at all; `rlib` keeps the library usable as an ordinary
# Rust dependency (of which there are none, but the type costs nothing to
# keep). The binary (`src/main.rs`) does not link against this — the two
# targets share source files, not a build dependency.
[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
# `panic = "abort"` would silently disable the catch_unwind at the worker
# boundary (ARCHITECTURE.md §9), which is what keeps one bad file from
# taking down an index of 3,000 good ones.
panic = "unwind"
